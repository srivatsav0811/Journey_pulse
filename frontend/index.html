<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JourneyPulse</title>
  <meta name="description" content="Adaptive Markov-chain customer journey intelligence: live transition matrix, what-if simulation, optimisation and an AI business advisor.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236aa8ff'/%3E%3Cstop offset='1' stop-color='%2327d3b4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%230b1224'/%3E%3Cpath d='M5 19h5l3-8 5 13 3-7h6' fill='none' stroke='url(%23g)' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/views.css">
</head>
<body>
  <!-- Liquid-glass refraction filter (used as a backdrop-filter in Chromium browsers) -->
  <svg class="defs" aria-hidden="true" width="0" height="0">
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="liquid-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- Ambient background: aurora blobs, drifting glass orbs (cursor-reactive), grain -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <canvas id="orbs" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <div class="shell">
    <aside class="sidebar glass" aria-label="Main navigation">
      <a class="brand" href="#/overview" aria-label="JourneyPulse home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 19h5l3-8 5 13 3-7h6"/></svg></span>
        <span class="brand-text"><strong>JourneyPulse</strong><small>Adaptive journey intelligence</small></span>
      </a>
      <label class="select-wrap dataset-pick" title="Dataset">
        <span class="eyebrow">Dataset</span>
        <select id="dataset-select"></select>
      </label>
      <nav class="nav" id="nav">
        <span class="nav-liquid" aria-hidden="true"></span>
      </nav>
      <div class="sidebar-foot">
        <div class="advisor-mode" id="advisor-mode"><span class="dot"></span><span>Advisor</span></div>
        <p class="tiny muted">Group 12 · 23MAT204<br>Mathematics for Intelligent Systems 3</p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar glass">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="page-title">
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-controls">
          <div class="stream" role="group" aria-label="Stream monthly data into the live model">
            <button class="icon-btn" data-stream="reset" title="Rewind to the frozen first-month snapshot" aria-label="Rewind to first month">
              <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
            <button class="icon-btn" data-stream="prev" title="Step back one month" aria-label="Previous month">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <a class="live-pill" id="live-pill" href="#/adaptive" title="The live, self-updating transition matrix every analysis reads">
              <span class="pulse"></span><span class="live-text">Live matrix</span><strong id="live-version">v–</strong><span id="live-label" class="muted">…</span>
            </a>
            <button class="btn btn-primary stream-next" data-stream="next" data-magnetic title="Stream the next month of data into the model">
              <svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6"/></svg><span class="next-text">Stream next month</span></button>
            <button class="icon-btn" data-stream="latest" title="Jump to the latest month" aria-label="Latest month">
              <svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
          </div>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle light or dark theme" title="Toggle theme">
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <!-- Floating AI advisor -->
  <button class="advisor-fab" id="advisor-fab" data-magnetic aria-label="Ask the AI advisor" aria-expanded="false">
    <span class="fab-core"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>
    <span class="fab-label">Ask the advisor</span>
  </button>
  <aside class="drawer glass" id="drawer" aria-label="AI advisor" hidden>
    <header class="drawer-head">
      <div><strong>Business advisor</strong><p class="tiny muted" id="drawer-mode">Answers from the live model</p></div>
      <div class="drawer-actions">
        <a class="icon-btn" href="#/advisor" title="Open full advisor" aria-label="Open full advisor page"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M10 5H5v14h14v-5"/></svg></a>
        <button class="icon-btn" id="drawer-close" aria-label="Close advisor"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <div class="chat" id="drawer-chat"></div>
  </aside>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
